<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>チャンピオン メインレーン一覧(JP)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EA; --surface:#F8F9F5; --ink:#1D2B28; --muted:#5E6E69; --line:#CDD5CE;
  --rift:#2F5D50; --gold:#A8842F;
  --top:#B5523B; --jungle:#4C7A3A; --mid:#3E62A8; --adc:#A8842F; --support:#7A5A9E;
  --on-bar:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16211F; --surface:#1D2A27; --ink:#E6ECE7; --muted:#9AAAA4; --line:#33443F;
    --rift:#7FB8A5; --gold:#D6B25E; --on-bar:#14201D;
    --top:#E08A72; --jungle:#8DBE72; --mid:#86A7E6; --adc:#D6B25E; --support:#B79AD8;
  }
}
:root[data-theme="dark"]{
  --bg:#16211F; --surface:#1D2A27; --ink:#E6ECE7; --muted:#9AAAA4; --line:#33443F;
  --rift:#7FB8A5; --gold:#D6B25E; --on-bar:#14201D;
  --top:#E08A72; --jungle:#8DBE72; --mid:#86A7E6; --adc:#D6B25E; --support:#B79AD8;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:900;letter-spacing:.02em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px;font-size:.92rem}
.lanes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px}
.lane{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;
  padding:10px 8px;text-align:left;cursor:pointer;font:inherit}
.lane .n{display:block;font-size:1.7rem;font-weight:900;line-height:1.1;color:var(--c)}
.lane .l{font-size:.85rem;color:var(--muted)}
.lane[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 -4px 0 var(--c)}
.lane:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools input[type=search],.tools select{font:inherit;padding:9px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);color:var(--ink)}
.tools input[type=search]{flex:1;min-width:180px}
.btn{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--rift);background:transparent;color:var(--rift);cursor:pointer}
.btn.solid{background:var(--rift);color:var(--surface)}
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(170px,1.3fr) 110px 1.6fr;gap:14px;align-items:center;
  padding:10px 4px;border-bottom:1px solid var(--line)}
.name{font-weight:700;overflow-wrap:anywhere;display:flex;align-items:center;gap:10px;min-width:0}
.icon{width:40px;height:40px;flex:none;border-radius:8px;border:2px solid var(--line);background:var(--line);object-fit:cover}
.icon.ph{display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:1rem}
.name small{display:block;font-weight:400;font-size:.75rem;color:var(--muted);text-transform:capitalize;line-height:1.2}
.badge{display:inline-flex;align-items:baseline;gap:6px;font-weight:700;color:var(--c)}
.badge small{color:var(--muted);font-weight:400}
.badge.none{color:var(--muted);font-weight:500}
.note{font-size:.8rem;color:var(--muted)}
.bar{display:flex;height:20px;border-radius:6px;overflow:hidden;background:var(--line);gap:2px}
.bar span{background:var(--c);height:100%;display:flex;align-items:center;justify-content:center;
  color:var(--on-bar);font-size:.72rem;font-weight:700;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:0 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:5px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:48px 20px;text-align:center;background:var(--surface)}
.drop p{margin:0 0 14px}
.foot{margin-top:28px;font-size:.8rem;color:var(--muted)}
.err{color:var(--top);margin-top:10px}
.credit{margin-top:6px;font-size:.8rem;color:var(--muted);letter-spacing:.02em}
@media (max-width:640px){
  .lanes{grid-template-columns:repeat(3,1fr)}
  .row{grid-template-columns:1fr auto;}
  .row .bar,.row .note{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>メインレーン一覧(JP)</h1>
  <p class="sub" id="meta">チャンピオンごとに、OP.GGでピック率が一番高いレーン</p>

  <div id="empty" class="drop">
    <p id="status">データを読み込んでいます…</p>
  </div>

  <div id="main" hidden>
    <div class="lanes" id="lanes"></div>
    <div class="tools">
      <input type="search" id="q" placeholder="チャンピオン名で絞り込み（日本語・英語）" aria-label="チャンピオン名で絞り込み">
      <select id="sort" aria-label="並び順">
        <option value="name">名前順</option>
        <option value="rate">ピック率が高い順</option>
        <option value="flex">複数レーンで使われる順</option>
      </select>
    </div>
    <div class="legend" id="legend"></div>
    <div class="list" id="list"></div>
    <p class="foot">データ出典: OP.GG（https://op.gg）、チャンピオン名: Riot Games。バーは各レーンで使われている割合です（細い部分はカーソルを合わせると数値が出ます）。毎日6:00(JST)ごろ自動更新。</p>
    <p class="credit">powered by げじげじ（Vout NCG）</p>
  </div>
</div>

<script>
const LANES = [
  {k:"top",label:"トップ"},{k:"jungle",label:"ジャングル"},{k:"mid",label:"ミッド"},
  {k:"adc",label:"ADC"},{k:"support",label:"サポート"}
];
const laneOf = k => LANES.find(l => l.k === k);
let data = [], meta = "", filter = null;

const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, "");

// Riot公式のData Dragonから、日本語名・アイコンの対応表と全チャンピオンの一覧を作る
async function loadJapaneseNames(){
  const get = async u => { const r = await fetch(u); if (!r.ok) throw new Error(u); return r.json(); };
  const [ver] = await get("https://ddragon.leagueoflegends.com/api/versions.json");
  const base = `https://ddragon.leagueoflegends.com/cdn/${ver}/data`;
  const [ja, en] = await Promise.all([get(`${base}/ja_JP/champion.json`), get(`${base}/en_US/champion.json`)]);
  const map = {}, all = [];
  for (const [id, c] of Object.entries(ja.data)){
    const keys = [norm(id)];                                     // 例: monkeyking
    if (en.data[id]) keys.push(norm(en.data[id].name));          // 例: wukong
    const info = {ja: c.name, icon: `https://ddragon.leagueoflegends.com/cdn/${ver}/img/champion/${c.image.full}`};
    keys.forEach(k => map[k] = info);
    all.push({keys, name: en.data[id]?.name || id, ...info});
  }
  return {map, all};
}

async function loadData(){
  const namesPromise = loadJapaneseNames().catch(e => { console.warn("日本語名の取得に失敗", e); return {map:{}, all:[]}; });
  try {
    const res = await fetch("data.json", {cache:"no-store"});
    if (!res.ok) throw new Error(`data.json を取得できませんでした (HTTP ${res.status})。Actionsが一度も成功していない可能性があります。`);
    const json = await res.json();
    const {map, all} = await namesPromise;
    data = (json.champions || []).map(d => {
      const info = map[norm(d.name)];
      return {...d, ja: info?.ja || d.name, icon: info?.icon};
    });
    // OP.GGの一覧に載っていない（ピック率が低い等）チャンピオンも「データ不足」として加える
    const have = new Set(data.map(d => norm(d.name)));
    all.filter(c => !c.keys.some(k => have.has(k))).forEach(c =>
      data.push({name: c.name, ja: c.ja, icon: c.icon, main: null, rate: 0, rates: {}, nodata: true}));
    const t = new Date(json.updated_at);
    meta = `${json.scope ? json.scope + "・" : ""}${t.toLocaleString("ja-JP", {timeZone:"Asia/Tokyo"})} 更新`;
    render();
  } catch(e){
    document.getElementById("status").textContent = e.message;
  }
}

function show(has){
  document.getElementById("empty").hidden = has;
  document.getElementById("main").hidden = !has;
}

function render(){
  show(data.length > 0);
  if (!data.length) return;
  const nodata = data.filter(d => d.nodata).length;
  document.getElementById("meta").textContent = `${data.length}体${nodata ? `（うちデータ不足 ${nodata}体）` : ""}・${meta}`;

  const lanesEl = document.getElementById("lanes");
  lanesEl.innerHTML = "";
  LANES.forEach(l => {
    const b = document.createElement("button");
    b.className = "lane"; b.style.setProperty("--c", `var(--${l.k})`);
    b.setAttribute("aria-pressed", filter === l.k);
    b.innerHTML = `<span class="n">${data.filter(d => d.main === l.k).length}</span><span class="l">${l.label}</span>`;
    b.onclick = () => { filter = filter === l.k ? null : l.k; render(); };
    lanesEl.appendChild(b);
  });

  document.getElementById("legend").innerHTML =
    LANES.map(l => `<span style="--c:var(--${l.k})"><i></i>${l.label}</span>`).join("");

  const q = document.getElementById("q").value.trim().toLowerCase();
  const sort = document.getElementById("sort").value;
  const flex = d => { const v = Object.values(d.rates).sort((a,b)=>b-a); return v.length > 1 ? v[1]/v[0] : 0; };
  let rows = data.filter(d => (!filter || d.main === filter) && (d.name.toLowerCase().includes(q) || d.ja.toLowerCase().includes(q) || toKata(d.ja).includes(toKata(q))));
  rows.sort(sort === "rate" ? (a,b)=>b.rate-a.rate : sort === "flex" ? (a,b)=>flex(b)-flex(a) : (a,b)=>a.ja.localeCompare(b.ja, "ja"));

  const list = document.getElementById("list");
  if (!rows.length){ list.innerHTML = `<p style="padding:16px 4px;color:var(--muted)">条件に合うチャンピオンがいません。</p>`; return; }
  list.innerHTML = rows.map(d => {
    const icon = d.icon
      ? `<img class="icon" src="${esc(d.icon)}" alt="" loading="lazy" width="40" height="40">`
      : `<span class="icon ph" aria-hidden="true">${esc(d.ja.slice(0,1))}</span>`;
    const name = `<span class="name">${icon}<span>${esc(d.ja)}${d.ja !== d.name ? `<small>${esc(d.name)}</small>` : ""}</span></span>`;
    if (d.nodata) return `<div class="row">${name}
      <span class="badge none">データ不足</span>
      <span class="note">ピック率が低く、OP.GGのレーン別一覧に未掲載</span></div>`;
    const l = laneOf(d.main) || {k:"mid",label:d.main};
    const total = Object.values(d.rates).reduce((a,b)=>a+b,0) || 1;
    // 各レーンの割合（そのチャンピオンの全レーン合計を100%とした比率）
    const used = LANES.filter(x => d.rates[x.k]);
    const share = x => d.rates[x.k] / total * 100;
    const segs = used.map(x => {
      const p = share(x);
      return `<span style="--c:var(--${x.k});width:${p}%" title="${x.label} ${Math.round(p)}%（ピック率 ${d.rates[x.k]}%）">${p >= 12 ? Math.round(p) + "%" : ""}</span>`;
    }).join("");
    const aria = used.map(x => `${x.label} ${Math.round(share(x))}%`).join("、");
    return `<div class="row">${name}
      <span class="badge" style="--c:var(--${l.k})">${l.label}</span>
      <div class="bar" role="img" aria-label="${aria}">${segs}</div></div>`;
  }).join("");
}
const toKata = s => s.replace(/[\u3041-\u3096]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

document.getElementById("q").oninput = render;
document.getElementById("sort").onchange = render;
loadData();
</script>
</body>
</html>
