name: Daily OP.GG crawl

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 6:00 JST (UTC 21:00)
  workflow_dispatch:        # Actionsタブから手動実行もできる
  push:                     # アップロード直後（スクリプトやこのファイルを更新した時）にも実行
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/crawl.yml"

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Crawl OP.GG
        run: python scripts/crawl.py

      - name: Commit data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Update data.json ($(TZ=Asia/Tokyo date '+%Y-%m-%d'))"
            git push
          fi
